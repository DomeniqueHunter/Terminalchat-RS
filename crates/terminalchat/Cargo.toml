[package]
name = "terminalchat"
description = "Terminal client for F-Chat (Rust version)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5"
base64 = "0.23.1"
chacha20poly1305 = "0.10"
chrono = "0.4.45"
fchat = { path = "../fchat" }
getrandom = "0.2"
keyring = "4.2"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
unicode-width = "0.2.3"
unicode_names2 = "4.0.0"
